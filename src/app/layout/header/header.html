<header class="hd" [class.hd--scrolled]="scrolled()">
  <div class="hd__inner">
    <a class="hd__mark" [routerLink]="'/' + locale()" aria-label="João Pedro Lourenço David">
      <span aria-hidden="true">JP</span>
    </a>

    <nav class="hd__nav" [attr.aria-label]="t().a11y.mainNav">
      @for (id of sections; track id) {
        <a class="hd__link" [routerLink]="'/' + locale()" [fragment]="id">{{ navLabel(id) }}</a>
      }
    </nav>

    <div class="hd__tools">
      <div class="hd__langs" role="group" [attr.aria-label]="t().a11y.languageLabel">
        @for (loc of locales; track loc) {
          <a
            class="hd__lang"
            [class.hd__lang--on]="loc === locale()"
            [routerLink]="'/' + loc"
            preserveFragment
            [attr.hreflang]="loc"
            [attr.aria-current]="loc === locale() ? 'true' : null"
            (click)="rememberLocale(loc)"
            >{{ localeLabel(loc) }}</a
          >
        }
      </div>

      <button
        type="button"
        class="hd__theme"
        (click)="toggleTheme()"
        [attr.aria-label]="t().a11y.themeLabel + ': ' + themeLabel()"
        [title]="t().a11y.themeLabel + ': ' + themeLabel()"
      >
        <!-- Três glifos distintos: sol, lua e círculo meio-a-meio. O ciclo tem
             três estados e um deles não muda a cor da tela, então o ícone é o
             que informa o usuário do que aconteceu. -->
        @switch (themeChoice()) {
          @case ('light') {
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="4" />
              @for (a of [0, 45, 90, 135, 180, 225, 270, 315]; track a) {
                <line x1="10" y1="1.5" x2="10" y2="3.5" [attr.transform]="'rotate(' + a + ' 10 10)'" />
              }
            </svg>
          }
          @case ('dark') {
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <path d="M16 12.2A7 7 0 0 1 7.8 4a6.5 6.5 0 1 0 8.2 8.2Z" />
            </svg>
          }
          @default {
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <circle cx="10" cy="10" r="6.5" />
              <path d="M10 3.5a6.5 6.5 0 0 1 0 13Z" class="hd__fill" />
            </svg>
          }
        }
        <span class="hd__theme-text">{{ themeLabel() }}</span>
      </button>
    </div>
  </div>
</header>
