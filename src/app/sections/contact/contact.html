<section class="ct tile-dark" id="contact">
  <div class="ct__grid">
    <h2 class="ct__heading" appReveal>{{ t().contact.heading }}</h2>

    <div class="ct__body" appReveal [appRevealDelay]="80">
      <p class="ct__lead">{{ t().contact.lead }}</p>

      <ul class="ct__links">
        <li>
          <a href="#"
             class="btn btn--secondary"
             (click)="$event.preventDefault(); copyToClipboard(contact.email)"
             [title]="'Copiar: ' + contact.email"
             role="button"
             [attr.aria-label]="justCopied() ? t().contact.emailLabel + ' (copiado!)' : 'Copiar: ' + contact.email">
            <span aria-live="polite" aria-atomic="true">
              {{ justCopied() ? 'Copiado!' : t().contact.emailLabel }}
            </span>
            <span aria-hidden="true">{{ justCopied() ? '✓' : '' }}</span>
          </a>
        </li>
        <li>
          <a class="btn btn--secondary arrow-external" [href]="contact.linkedin" target="_blank" rel="noopener noreferrer">
            {{ t().contact.linkedinLabel }}
          </a>
        </li>
        <li>
          <a class="btn btn--secondary arrow-external" [href]="contact.github" target="_blank" rel="noopener noreferrer">
            {{ t().contact.githubLabel }}
          </a>
        </li>
        <li>
          <a class="btn btn--secondary arrow-download" [href]="resumeHref()" download>
            {{ t().contact.resumeLabel }}
          </a>
        </li>
      </ul>
    </div>
  </div>
</section>
